<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Créer ma montre — MigMods (page autonome)</title>
  <meta name="description" content="Configurateur MigMods hors Shopify : boîtier, cadran, lunette, aiguilles, bracelet, aperçu en temps réel.">
  <meta name="robots" content="noindex">
  <!-- Polices du thème (aucune police distante, DESIGN-SYSTEM.md §2.2) : servir le dossier migmods/ pour que ../theme/assets soit lisible. -->
  <style>
    @font-face { font-family: "Cormorant Garamond"; src: url("../theme/assets/cormorant-garamond-300.woff2") format("woff2"); font-weight: 300; font-display: swap; }
    @font-face { font-family: "Cormorant Garamond"; src: url("../theme/assets/cormorant-garamond-500.woff2") format("woff2"); font-weight: 500; font-display: swap; }
    @font-face { font-family: "Cormorant Garamond"; src: url("../theme/assets/cormorant-garamond-400-italic.woff2") format("woff2"); font-weight: 400; font-style: italic; font-display: swap; }
    @font-face { font-family: "Inter"; src: url("../theme/assets/inter.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
    html { color-scheme: dark; }
    html, body { margin: 0; background: #050505; color: #F3F4F6; }
    .site-head { display: flex; align-items: center; justify-content: center; height: 60px; border-bottom: 1px solid rgba(255,255,255,.10); font: 500 12px Inter, system-ui, sans-serif; letter-spacing: .24em; text-transform: uppercase; color: #9CA0A7; }
    .site-foot { text-align: center; font: 13px/1.6 Inter, system-ui, sans-serif; color: #9CA0A7; padding: 32px 20px 120px; border-top: 1px solid rgba(255,255,255,.10); }
    @media (max-width: 899px) { .site-head, .site-foot { display: none; } }
  </style>
  <link rel="stylesheet" href="configurator.css">
</head>
<body>
  <header class="site-head">MigMods · configurateur</header>
  <main>
    <div data-migmods-configurator data-src="components.json"></div>
  </main>
  <footer class="site-foot">
    MigMods n’est pas affilié à Seiko. Les montres sont assemblées avec des mouvements Seiko et des composants aftermarket.<br>
    Page autonome de test : prix du catalogue, pas de panier (le contenu envoyé au panier s’affiche dans une fenêtre).
  </footer>
  <script>
    window.MIGMODS_OPTIONS = { stage: 'none', scaleSmall: 0.96, scaleLarge: 0.8, watermarkSrc: '../theme/assets/logo-migmods-480.png' };
  </script>
  <script src="configurator.js" defer></script>
</body>
</html>
