<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Espace équipe — VAYNORA House</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1B1036">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" href="assets/fonts/PlusJakartaSans-normal-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/os.css">
</head>
<body>

<section class="gate" id="gate">
  <form class="gate-card" id="gateForm" autocomplete="off">
    <div class="brand">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="#1B1036"/><path d="M12.5 13 20 28.5 27.5 13" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="20" cy="10" r="2.4" fill="#2F5BFF"/></svg>
      <div><b>VAYNORA</b><span>Espace équipe</span></div>
    </div>
    <div>
      <h1 style="font-size:1.5rem">Accès réservé à l'équipe</h1>
      <p class="muted" style="margin-top:6px">Tableau de bord de l'agence et Formation OFM complète. Entrez le code d'accès qui vous a été remis.</p>
    </div>
    <label class="f">Code d'accès
      <input id="code" name="code" type="password" required autocomplete="current-password" placeholder="VNR-XXXX-XXXX-XXXX" spellcheck="false">
    </label>
    <label class="chk"><input type="checkbox" id="remember"> Rester connecté sur cet appareil</label>
    <p class="err" id="gateErr" role="alert"></p>
    <button class="btn btn-primary" id="gateBtn" type="submit">Entrer</button>
    <a class="back" href="./">← Retour au site VAYNORA House</a>
  </form>
</section>

<div class="app" id="app" hidden>
  <aside class="side" id="side" aria-label="Navigation de l'espace équipe">
    <a class="brand" href="#/">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="#2F5BFF"/><path d="M12.5 13 20 28.5 27.5 13" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="20" cy="10" r="2.4" fill="#1B1036"/></svg>
      <div><b>VAYNORA</b><span>Espace équipe</span></div>
    </a>
    <nav id="nav"></nav>
    <div class="foot">
      <div class="who"><span class="av" id="whoAv">V</span><div><b id="whoName" style="color:#fff;display:block;font-size:.86rem">Équipe</b><span id="whoAg" style="color:#8F86B3;font-size:.74rem"></span></div></div>
      <div class="row"><a href="./">Site public ↗</a><button type="button" id="lockBtn">Verrouiller</button></div>
    </div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>
  <div class="main">
    <header class="top"><div class="in">
      <button class="burger" id="burger" type="button" aria-label="Ouvrir le menu" aria-controls="side" aria-expanded="false"><span></span><span></span><span></span></button>
      <div class="ttl" id="ttl">Vue d'ensemble</div>
      <div class="tools" id="tools"></div>
    </div></header>
    <main class="content" id="view" tabindex="-1"></main>
  </div>
</div>

<dialog class="mdl" id="mdl" aria-labelledby="mdlT"></dialog>
<div class="tip" id="tip" hidden></div>
<div class="toast" id="toast" hidden role="status"></div>

<script src="assets/vendor/marked.min.js"></script>
<script src="assets/os.js"></script>
</body>
</html>
